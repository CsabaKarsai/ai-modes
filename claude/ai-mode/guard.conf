# Guard configuration.
#
# Deliberately contains NO list of technologies, languages or skill areas.
# Which work deserves the learning tax is your call, made by choosing a mode --
# not something this file should try to predict or keep up to date.
#
# EXEMPT   paths the guard never touches, in any mode (its own tooling, temp
#          files, git internals). Infrastructure, not a skills profile.
# NOTES_OK documents rather than code: writable in study mode so session notes
#          can still be written down.

EXEMPT='^('"$HOME"'|~|\$HOME)/\.claude/|^/tmp/claude-|/\.git/'
NOTES_OK='\.(md|markdown|txt|rst|adoc)$'
